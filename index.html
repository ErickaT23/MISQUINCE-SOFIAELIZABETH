<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Mis Quince Sofía Elizabeth</title>
  <meta property="og:title" content="Mis Quince Sofía Elizabeth">
  <meta property="og:description" content="Estás invitado a celebrar los Quince de Sofía Elizabeth">
  <meta property="og:image" content="https://i.postimg.cc/Vs2PG9pF/XVSE.png">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Arapey:ital@0;1&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      font-family: "Arapey", serif;
    }

    /* ── Pantalla de inicio ── */
    #pantalla-inicio {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px;
      text-align: center;
      background: #ffffff;
      width: 100%;
    }

    #pantalla-inicio h1,
    #pantalla-inicio h2 {
      font-family: 'Great Vibes', cursive;
      font-weight: 400;
      background: radial-gradient(circle, #ffd985, #e0a92f, #ffd985);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
      padding: 10px;
    }

    #pantalla-inicio h1 { font-size: 3.2rem; margin-bottom: 4px; }
    #pantalla-inicio h2 { font-size: 3.2rem; margin-bottom: 36px; }

    #btn-ver {
      background: #016070;
      color: white;
      border: none;
      padding: 14px 36px;
      border-radius: 40px;
      font-size: 1.2rem;
      font-family: "Arapey", serif;
      font-style: italic;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    #btn-ver:hover { background: #295861; transform: translateY(-2px); }
    #btn-ver:active { transform: translateY(0); }

    /* ── Visor ── */
    #visor {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      background: #ffffff;
    }

    /* ── Spinner ── */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 60px 24px;
      color: #016070;
      font-style: italic;
      font-size: 1.05rem;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(1, 96, 112, 0.2);
      border-top-color: #016070;
      border-radius: 50%;
      animation: girar 0.8s linear infinite;
    }

    @keyframes girar { to { transform: rotate(360deg); } }

    /* ── Contenedor imagen + botones ── */
    .inv-wrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
      display: none;
    }

    .inv-wrapper img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Área clickeable transparente sobre el diseño */
    .btn-overlay {
      position: absolute;
      left: 20%;
      width: 56%;
      cursor: pointer;
      background: transparent;
      /* Descomenta para ver posición: background: rgba(255,0,0,0.3); */
    }

    /* CÓMO LLEGAR - Iglesia */
    #btn-iglesia {
      top: 41.8%;
      height: 2.0%;
    }

    /* CÓMO LLEGAR - Recepción */
    #btn-recepcion {
      top: 48.2%;
      height: 2.0%;
    }

    /* CONFIRMAR TU ASISTENCIA */
    #btn-confirmar {
      top: 96.1%;
      height: 1.8%;
      left: 10%;
      width: 80%;
    }
  </style>
</head>

<body>

  <!-- Pantalla de inicio -->
  <div id="pantalla-inicio">
    <h1>Mis Quince</h1>
    <h2>Sofía Elizabeth</h2>
    <button id="btn-ver">Ver Invitación</button>
  </div>

  <!-- Visor -->
  <div id="visor">
    <div id="loading">
      <div class="spinner"></div>
      <span>Cargando invitación...</span>
    </div>

    <div class="inv-wrapper" id="inv-wrapper">
      <img id="inv-img" src="" alt="Invitación Sofía Elizabeth">

      <a id="btn-iglesia"
         class="btn-overlay"
         href="https://maps.app.goo.gl/9F5r8nwYoiW6bLav8"
         target="_blank" rel="noopener noreferrer"
         aria-label="Cómo llegar a la iglesia"></a>

      <a id="btn-recepcion"
         class="btn-overlay"
         href="https://maps.app.goo.gl/vfxGkGt2G6f8eDQt8"
         target="_blank" rel="noopener noreferrer"
         aria-label="Cómo llegar a la recepción"></a>

      <a id="btn-confirmar"
         class="btn-overlay"
         href="#"
         target="_blank" rel="noopener noreferrer"
         aria-label="Confirmar asistencia"></a>
    </div>
  </div>

  <script>
    const rsvpLinks = {
      '1': 'https://wa.link/0jcf69',
      '2': 'https://wa.link/nyo61r',
      '3': 'https://wa.link/ylc2u9',
      '4': 'https://wa.link/oktjoh',
      '5': 'https://wa.link/kfr7uu'
    };
    const imagenes = {
    '1': '/Mis Quince Sofia Elizabeth - 1 Pase.png',
    '2': '/Mis Quince Sofia Elizabeth - 2 Pases.png',
    '3': '/Mis Quince Sofía Elizabeth - 3 pases.png',
    '4': '/Mis Quince Sofía Elizabeth - 4 pases.png',
    '5': '/Mis Quince Sofía Elizabeth - 5 pases.png'
    };

    const params  = new URLSearchParams(window.location.search);
    const pases   = params.get('pases') || '1';
    const imgSrc  = imagenes[pases] || imagenes['1'];
    const rsvp    = rsvpLinks[pases] || rsvpLinks['1'];

    document.getElementById('btn-confirmar').href = rsvp;

    document.getElementById('btn-ver').addEventListener('click', () => {
      document.getElementById('pantalla-inicio').style.display = 'none';
      document.getElementById('visor').style.display = 'flex';

      const img = document.getElementById('inv-img');
      img.src = imgSrc;

      img.onload = () => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('inv-wrapper').style.display = 'block';
      };

      img.onerror = () => {
        document.getElementById('loading').innerHTML =
          '<p style="color:#c00;padding:20px">Error cargando la imagen. Intenta de nuevo.</p>';
      };
    });
  </script>

</body>
</html>
